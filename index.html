<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon PEA</title>
<script>(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#F3F1E7;--white:#FFFEFA;--ink:#130f40;--muted:#6e6c8f;--apple:#badc58;--on-apple:#130f40;--soft:#E7E4D6;--coral:#eb4d4b;--up:#6ab04c;--r:28px;
--pill-bg:#130f40;--pill-fg:#badc58;--tile2-bg:#6ab04c;--tile2-fg:#130f40;--tile2-acc:#130f40;
--line-val:#6ab04c;--line-inv:#130f40;--area:rgba(106,176,76,.2);
--chip-bg:#badc58;--chip-fg:#130f40;--chip-nbg:#eb4d4b;--chip-nfg:#fff;
--tip-bg:#130f40;--tip-fg:#F3F1E7;--tip-acc:#badc58;--warn-bg:#badc58;--warn-fg:#130f40;--shade:rgba(19,15,64,.55)}
:root[data-theme="dark"]{color-scheme:dark;--paper:#130f40;--white:#30336b;--ink:#dff9fb;--muted:#a3a7d6;--apple:#badc58;--on-apple:#130f40;--soft:rgba(223,249,251,.12);--coral:#ff7979;--up:#badc58;
--pill-bg:#130f40;--pill-fg:#badc58;--tile2-bg:#6ab04c;--tile2-fg:#130f40;--tile2-acc:#130f40;
--line-val:#badc58;--line-inv:#dff9fb;--area:rgba(186,220,88,.16);
--chip-bg:#badc58;--chip-fg:#130f40;--chip-nbg:#ff7979;--chip-nfg:#130f40;
--tip-bg:#130f40;--tip-fg:#dff9fb;--tip-acc:#badc58;--warn-bg:#badc58;--warn-fg:#130f40;--shade:rgba(8,6,32,.7)}
*{box-sizing:border-box;margin:0}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:clamp(14px,3vw,36px)}
.wrap{max-width:1120px;margin:auto;display:grid;gap:14px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;background:var(--apple);border-radius:50% 50% 50% 8px;position:relative;flex:none}
.logo::after{content:"";position:absolute;inset:14px;background:var(--on-apple);border-radius:50% 0 50% 0}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.stamp{color:var(--muted);font-size:.85rem;margin-top:4px}.stamp:empty{display:none}
.btn.round{width:46px;height:46px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.round svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:13px 22px;border-radius:99px;font-weight:600;background:var(--ink);color:var(--paper)}
.btn.apple{background:var(--apple);color:var(--on-apple)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--coral);color:var(--chip-nfg)}
.delInfo{background:var(--paper);border-radius:18px;padding:16px 18px}
.delInfo small{display:block;margin-top:4px;color:var(--muted);font-size:.85rem;line-height:1.5}
.btn:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.tile{border-radius:var(--r);padding:28px;background:var(--white)}
.hero{grid-column:span 12;background:var(--apple);color:var(--on-apple);display:grid;grid-template-columns:1.35fr 1fr;gap:32px;padding:34px}
.hl{display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:190px}
.hl .lbl{font-weight:600}
.when{font-size:.85rem;font-weight:600;opacity:.65}
.hr{display:flex;flex-direction:column;justify-content:center;gap:22px;border-left:2px solid rgba(19,15,64,.16);padding-left:32px}
.kpi span{display:block;font-weight:600;opacity:.7;font-size:.92rem}
.kpi b{display:block;font-size:2rem;letter-spacing:-.04em;font-weight:800;line-height:1.15}
.kpi span.pill{display:inline-block;opacity:1;margin-top:8px;font-size:.9rem;padding:6px 14px}
.big{font-size:clamp(2.8rem,8vw,5.4rem);font-weight:800;letter-spacing:-.05em;line-height:.95}
.pill{display:inline-block;align-self:flex-start;padding:9px 18px;border-radius:99px;font-weight:600;background:var(--pill-bg);color:var(--pill-fg)}
.pill.neg{color:var(--coral)}
.chartTile{grid-column:span 12}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h2{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.ranges{display:flex;gap:6px;background:var(--paper);padding:5px;border-radius:99px}
.ranges button{background:transparent;padding:7px 15px;border-radius:99px;font-weight:600;font-size:.88rem}
.ranges button.on{background:var(--apple);color:var(--on-apple)}
.legendC{display:flex;gap:20px;font-size:.88rem;font-weight:600;margin-bottom:6px;flex-wrap:wrap}
.legendC i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:8px;vertical-align:middle}
.legendC i.v{background:var(--line-val)} .legendC i.n{background:var(--line-inv)}
#chart{position:relative;height:320px}
#chart svg{display:block;width:100%;height:320px;touch-action:none}
#chart text{font:600 11px "Bricolage Grotesque",sans-serif;fill:var(--muted)}
#chart .g{stroke:var(--paper);stroke-width:2}
.tip{position:absolute;top:8px;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);border-radius:16px;padding:12px 16px;font-size:.85rem;line-height:1.5;white-space:nowrap;display:none}
.tip b{color:var(--tip-acc)}
.alloc{grid-column:span 12}
.bar{display:flex;height:30px;gap:4px;margin:16px 0}
.bar i{display:block;min-width:8px;border-radius:10px}
.bar i:first-child{border-radius:99px 10px 10px 99px}.bar i:last-child{border-radius:10px 99px 99px 10px}.bar i:only-child{border-radius:99px}
.legend{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:.92rem}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);margin-right:8px}
.lines{grid-column:span 12;padding:24px 18px 14px;background:transparent}
.lines h2{padding:0 10px 4px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:760px}
th{text-align:right;font-weight:600;color:var(--muted);font-size:.82rem;padding:4px 16px}
td{background:var(--white);text-align:right;padding:16px;font-variant-numeric:tabular-nums}
td:first-child{border-radius:20px 0 0 20px;text-align:left}td:last-child{border-radius:0 20px 20px 0;padding:8px}
th:first-child{text-align:left}
td small{display:block;color:var(--muted);font-size:.8rem}
.gain{display:flex;align-items:center;justify-content:flex-end;gap:12px;white-space:nowrap}
.chip{display:inline-block;min-width:92px;text-align:center;padding:6px 12px;border-radius:99px;font-weight:700;background:var(--chip-bg);color:var(--chip-fg)}
.chip.neg{background:var(--chip-nbg);color:var(--chip-nfg)}
.x{width:38px;height:38px;border-radius:50%;background:var(--paper);font-size:1rem}
.x:hover{background:var(--coral);color:#fff}
.empty{text-align:center;padding:60px 16px;grid-column:span 12}
.empty p{margin-bottom:18px;font-size:1.1rem;font-weight:600}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:20px;padding:14px 20px;font-weight:600;font-size:.92rem}
dialog{border:0;border-radius:var(--r);padding:30px;width:min(480px,92vw);background:var(--white);color:var(--ink);margin:auto}
dialog::backdrop{background:var(--shade)}
dialog h2{margin-bottom:18px;font-size:1.4rem}
label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:12px}
input,select{font:inherit;font-weight:400;width:100%;margin-top:6px;padding:13px 16px;border-radius:16px;border:0;background:var(--paper);color:var(--ink)}
input:focus,select:focus{outline:3px solid var(--apple)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:.8rem;color:var(--muted);margin:-6px 0 14px}
@media(max-width:820px){.hero{grid-template-columns:1fr;gap:22px;padding:24px}.hl{min-height:0}.hr{border-left:0;border-top:2px solid rgba(19,15,64,.16);padding:22px 0 0}.tile{padding:22px}}
@media(prefers-reduced-motion:no-preference){.big{animation:in .6s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(12px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo"></div><div><h1>Mon PEA</h1><div class="stamp" id="stamp">Chargement…</div></div></div>
    <div class="row">
      <button class="btn ghost round" id="theme" aria-label="Changer de thème"></button>
      <button class="btn ghost" id="refresh">Actualiser les cours</button>
      <button class="btn apple" id="add">Ajouter un achat</button>
    </div>
  </header>
  <div id="warn"></div>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2>Ajouter un achat</h2>
    <label id="knownLbl">ETF<select id="known"></select></label>
    <div id="newEtf">
      <label>Nom de l’ETF<input name="name" required placeholder="Amundi MSCI World"></label>
      <label>Symbole Yahoo Finance<input name="ticker" required placeholder="CW8.PA"></label>
      <p class="hint">Pour un ETF coté à Paris, ajoute .PA au code (ex. CW8.PA, ESE.PA).</p>
    </div>
    <div class="two">
      <label>Quantité<input name="qty" type="number" step="any" min="0" required></label>
      <label>Prix d’achat par part (€)<input name="buy" type="number" step="any" min="0" required></label>
      <label>Frais totaux (€)<input name="fees" type="number" step="any" min="0" placeholder="0"></label>
      <label>Date d’achat<input name="date" type="date" required></label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:6px">
      <button type="button" class="btn ghost" id="cancel">Annuler</button>
      <button class="btn apple" type="submit">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="delDlg">
  <h2>Supprimer cet achat ?</h2>
  <div class="delInfo" id="delInfo"></div>
  <p class="hint" style="margin:14px 0 20px">Cette action est définitive.</p>
  <div class="row" style="justify-content:flex-end">
    <button type="button" class="btn ghost" id="delNo">Annuler</button>
    <button type="button" class="btn danger" id="delYes">Supprimer</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const eur = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(n);
const pct = n => (n>=0?"+":"")+n.toFixed(2).replace(".",",")+" %";
const sgn = n => (n>=0?"+":"")+eur(n);
const cls = n => n>=0?"up":"down";
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PALETTES = {light:["#6ab04c","#badc58","#130f40","#30336b","#22a6b3","#7ed6df"],dark:["#badc58","#6ab04c","#dff9fb","#7ed6df","#22a6b3","#c7ecee"]};
const theme = () => document.documentElement.dataset.theme;
let RANGE = "Tout", SER = [], KNOWN = [], LAST = null;

async function api(path, opts){
  const r = await fetch(path, opts && {...opts, headers:{"Content-Type":"application/json"}});
  if(!r.ok) throw new Error((await r.json()).error || "Erreur");
  return r.json();
}

function series(lots, hist){
  const dates = new Set();
  Object.values(hist).forEach(h => h.forEach(([d]) => dates.add(d)));
  const sorted = [...dates].sort();
  const first = lots.map(l=>l.date).filter(Boolean).sort()[0] || sorted[0];
  const ptr = {}, last = {}, out = [];
  for(const d of sorted.filter(d => d >= first)){
    for(const t in hist){
      let i = ptr[t] || 0;
      while(i < hist[t].length && hist[t][i][0] <= d){ last[t] = hist[t][i][1]; i++; }
      ptr[t] = i;
    }
    let val = 0, inv = 0;
    for(const l of lots){
      if((l.date || first) <= d && last[l.ticker] != null){ inv += l.cost; val += l.qty * last[l.ticker]; }
    }
    out.push({d, val, inv});
  }
  return out;
}

function drawChart(){
  const box = $("#chart"); if(!box) return;
  if(SER.length < 2){ box.innerHTML = `<p style="padding:90px 0;text-align:center;color:var(--muted);font-weight:600">L’historique apparaîtra dès qu’il y aura au moins deux jours de cours.</p>`; return; }
  const days = {"1M":30,"3M":91,"6M":182,"1A":365}[RANGE];
  let s = SER;
  if(days){ const c = new Date(Date.now()-days*864e5).toISOString().slice(0,10); s = SER.filter(p=>p.d>=c); if(s.length<2) s = SER.slice(-2); }
  const W = box.clientWidth, H = 320, m = {l:70,r:14,t:14,b:30}, n = s.length;
  const all = s.flatMap(p=>[p.val,p.inv]); let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi-lo || hi*.1 || 1)*.15; lo = Math.max(0, lo-pad); hi += pad;
  const x = i => m.l + (W-m.l-m.r)*i/(n-1), y = v => m.t + (H-m.t-m.b)*(1-(v-lo)/(hi-lo));
  const path = k => s.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p[k]).toFixed(1)).join("");
  const grid = [0,1,2,3].map(i=>{ const v = lo+(hi-lo)*i/3;
    return `<line class="g" x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l-12}" y="${y(v)+4}" text-anchor="end">${Math.round(v).toLocaleString("fr-FR")} €</text>`; }).join("");
  const fmt = d => new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"2-digit"});
  const xl = [[0,"start"],[Math.round((n-1)/2),"middle"],[n-1,"end"]].map(([i,a])=>`<text x="${x(i)}" y="${H-8}" text-anchor="${a}">${fmt(s[i].d)}</text>`).join("");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${grid}${xl}
    <path d="${path("val")}L${x(n-1)} ${H-m.b}L${x(0)} ${H-m.b}Z" style="fill:var(--area)"/>
    <path d="${path("inv")}" fill="none" style="stroke:var(--line-inv)" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
    <path d="${path("val")}" fill="none" style="stroke:var(--line-val)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="cl" y1="${m.t}" y2="${H-m.b}" style="stroke:var(--line-val)" stroke-width="2" opacity="0"/>
    <circle id="cd" r="8" style="fill:var(--white);stroke:var(--line-val)" stroke-width="4" opacity="0"/></svg><div class="tip" id="tip"></div>`;
  const svg = box.querySelector("svg"), tip = $("#tip");
  const move = e => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(n-1, Math.round((e.clientX-r.left-m.l)/(W-m.l-m.r)*(n-1))));
    const p = s[i], g = p.val-p.inv;
    $("#cl").setAttribute("x1",x(i)); $("#cl").setAttribute("x2",x(i)); $("#cl").setAttribute("opacity",1);
    $("#cd").setAttribute("cx",x(i)); $("#cd").setAttribute("cy",y(p.val)); $("#cd").setAttribute("opacity",1);
    tip.innerHTML = `${fmt(p.d)}<br>Valeur <b>${eur(p.val)}</b><br>Investi ${eur(p.inv)}<br>Gain <b>${sgn(g)}</b> (${pct(p.inv?g/p.inv*100:0)})`;
    tip.style.display = "block";
    tip.style.left = Math.min(Math.max(x(i)+14, 0), W-tip.offsetWidth)+"px";
  };
  svg.onpointermove = move; svg.onpointerdown = move;
  svg.onpointerleave = () => { tip.style.display="none"; $("#cl").setAttribute("opacity",0); $("#cd").setAttribute("opacity",0); };
}

function render(d){
  LAST = d;
  const lots = d.positions.map(p=>{
    const px = d.prices[p.ticker]?.price, cost = p.qty*p.buy + p.fees, val = px!=null ? p.qty*px : null;
    return {...p, px, cost, val, gain: val!=null ? val-cost : null};
  });
  KNOWN = [...new Map(d.positions.map(p=>[p.ticker,{name:p.name,ticker:p.ticker}])).values()];
  const when = d.updated
    ? "Cours du " + new Date(d.updated).toLocaleString("fr-FR",{dateStyle:"long",timeStyle:"short"})
    : "Aucun cours pour l’instant";
  $("#stamp").textContent = lots.length ? "" : when;
  $("#warn").innerHTML = d.errors?.length
    ? `<div class="warn">Cours introuvable pour : ${d.errors.map(esc).join(", ")}. Vérifie le symbole (ex. CW8.PA) ou ta connexion.${d.errors.map(t=>d.error_details?.[t]?`<br><small>${esc(t)} → ${esc(d.error_details[t])}</small>`:"").join("")}</div>` : "";
  if(!lots.length){
    $("#main").innerHTML = `<div class="tile empty"><p>Ton PEA est vide pour l’instant.</p><button class="btn apple" onclick="openDlg()">Ajouter mon premier achat</button></div>`;
    return;
  }
  const priced = lots.filter(l=>l.val!=null);
  const invested = priced.reduce((s,l)=>s+l.cost,0), value = priced.reduce((s,l)=>s+l.val,0);
  const gain = value-invested, gp = invested ? gain/invested*100 : 0;
  const PAL = PALETTES[theme()];
  const byT = {}; priced.forEach(l=>{ (byT[l.ticker] ||= {name:l.name,val:0}).val += l.val; });
  const alloc = Object.entries(byT).sort((a,b)=>b[1].val-a[1].val);
  SER = series(priced, d.history || {});

  $("#main").innerHTML = `<div class="grid">
    <section class="tile hero">
      <div class="hl"><span class="lbl">Valeur actuelle</span><div class="big">${eur(value)}</div><span class="when">${when}</span></div>
      <div class="hr">
        <div class="kpi"><span>Total investi, frais inclus</span><b>${eur(lots.reduce((s,l)=>s+l.cost,0))}</b></div>
        <div class="kpi"><span>Plus-value depuis le début</span><b>${sgn(gain)}</b><span class="pill ${gain<0?"neg":""}">${pct(gp)}</span></div>
      </div>
    </section>
    <section class="tile chartTile">
      <div class="top"><h2>Évolution</h2>
        <div class="ranges">${["1M","3M","6M","1A","Tout"].map(r=>`<button data-r="${r}" class="${r===RANGE?"on":""}">${r}</button>`).join("")}</div></div>
      <div class="legendC"><span><i class="v"></i>Valeur du portefeuille</span><span><i class="n"></i>Somme investie</span></div>
      <div id="chart"></div>
    </section>
    <section class="tile alloc"><h2>Répartition</h2>
      <div class="bar">${alloc.map(([t,a],i)=>`<i style="flex:${a.val};background:${PAL[i%PAL.length]}" title="${esc(a.name)}"></i>`).join("")}</div>
      <div class="legend">${alloc.map(([t,a],i)=>`<span style="--c:${PAL[i%PAL.length]}">${esc(a.name)} <b>${(a.val/value*100).toFixed(1).replace(".",",")} %</b></span>`).join("")}</div></section>
    <section class="tile lines"><h2>Mes achats</h2><div class="scroll"><table>
      <thead><tr><th>ETF</th><th>Quantité</th><th>Prix d’achat</th><th>Cours actuel</th><th>Valeur</th><th>Gain</th><th></th></tr></thead>
      <tbody>${lots.map(l=>`<tr>
        <td><b>${esc(l.name)}</b><small>${esc(l.ticker)}${l.date?" · "+new Date(l.date).toLocaleDateString("fr-FR"):""}</small></td>
        <td>${String(l.qty).replace(".",",")}</td>
        <td>${eur(l.buy)}${l.fees?`<small>+ ${eur(l.fees)} de frais</small>`:""}</td>
        <td>${l.px!=null?eur(l.px):"—"}</td><td><b>${l.val!=null?eur(l.val):"—"}</b></td>
        <td>${l.gain!=null?`<div class="gain"><b>${sgn(l.gain)}</b><span class="chip ${l.gain<0?"neg":""}">${pct(l.gain/l.cost*100)}</span></div>`:"—"}</td>
        <td><button class="x" aria-label="Supprimer cet achat" onclick="del('${l.id}')">✕</button></td></tr>`).join("")}</tbody>
    </table></div></section></div>`;
  drawChart();
}

function syncEtf(){
  const f = $("#form"), v = $("#known").value, isNew = v === "__new";
  $("#newEtf").style.display = isNew ? "" : "none";
  if(isNew){ f.name.value = ""; f.ticker.value = ""; }
  else { f.name.value = KNOWN[v].name; f.ticker.value = KNOWN[v].ticker; }
}
function openDlg(){
  const f = $("#form"); f.reset();
  f.date.value = new Date().toISOString().slice(0,10);
  $("#knownLbl").style.display = KNOWN.length ? "" : "none";
  $("#known").innerHTML = KNOWN.map((k,i)=>`<option value="${i}">${esc(k.name)} (${esc(k.ticker)})</option>`).join("")
    + `<option value="__new">＋ Nouvel ETF…</option>`;
  if(!KNOWN.length) $("#known").value = "__new";
  syncEtf();
  $("#dlg").showModal();
}
$("#known").onchange = syncEtf;
let DEL = null;
function del(id){
  const p = LAST && LAST.positions.find(x=>x.id===id); if(!p) return;
  DEL = id;
  $("#delInfo").innerHTML = `<b>${esc(p.name)}</b><small>${esc(p.ticker)}${p.date?" · acheté le "+new Date(p.date).toLocaleDateString("fr-FR"):""}<br>${String(p.qty).replace(".",",")} parts à ${eur(p.buy)}</small>`;
  $("#delDlg").showModal();
}
$("#delNo").onclick = () => $("#delDlg").close();
$("#delYes").onclick = async () => {
  try{ const d = await api("/api/positions/"+DEL,{method:"DELETE"}); $("#delDlg").close(); render(d); }
  catch(err){ alert(err.message); }
};
const themeBtn = () => { $("#theme").innerHTML = theme()==="dark"
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'; $("#theme").title = theme()==="dark" ? "Mode clair" : "Mode sombre"; };
$("#theme").onclick = () => {
  const t = theme()==="dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem("theme", t); }catch(e){}
  themeBtn(); if(LAST) render(LAST);
};
themeBtn();
$("#add").onclick = openDlg;
$("#cancel").onclick = () => $("#dlg").close();
document.addEventListener("click", e => {
  const b = e.target.closest("[data-r]"); if(!b) return;
  RANGE = b.dataset.r;
  document.querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on", x===b));
  drawChart();
});
addEventListener("resize", drawChart);
$("#refresh").onclick = async e => {
  e.target.disabled = true; e.target.textContent = "Actualisation…";
  try{ render(await api("/api/refresh",{method:"POST",body:"{}"})); }catch(err){ alert(err.message); }
  e.target.disabled = false; e.target.textContent = "Actualiser les cours";
};
$("#form").onsubmit = async e => {
  e.preventDefault();
  try{ render(await api("/api/positions",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))})); $("#dlg").close(); }
  catch(err){ alert(err.message); }
};
api("/api/data").then(render).catch(()=>{ $("#stamp").textContent = "Serveur injoignable : lance server.py"; });
</script>
</body>
</html>
